experiment_id: m6_forecasting_v1
extends: m4_temporal_model.yaml

forecasting:
  methods:
    - persistence
    - seasonal_naive
    - linear_trend
    - gbdt
  horizons_months: [1, 3, 6]
  max_lags: 6
  season_length: 12
  min_history: 8
  quantiles: [0.1, 0.9]

evaluation:
  spatial_block_size_m: 500
  train_fraction: 0.6
  val_fraction: 0.2

paths:
  processed_stack: data/processed/pilot/monthly_stack.nc
  results: results/m6
