experiment_id: m9_optimization_v1
extends: m8_intervention.yaml

optimization:
  budget_units: 1000
  water_budget_m3: 50000
  allow_preserve: true
  allow_restore: true
  allow_plant: true
  preserve_benefit_factor: 1.5
  strategies:
