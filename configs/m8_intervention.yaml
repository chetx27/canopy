experiment_id: m8_intervention_v1
extends: m7_heat_exposure.yaml

intervention:
  cooling_per_canopy_unit: 2.0
  max_eval_cells: 500
  min_exposure: 100.0
  preserve_sample: 100
  plant_sample: 200
  restore_sample: 100
  water_infeasible_fraction: 0.15
  preserve_maturity_threshold: 0.6
  preserve_canopy_threshold: 0.4
  plantable_canopy_max: 0.35
  restorable_canopy_max: 0.55
  preserve:
    loss_avoidance_fraction: 0.8
    immediacy_factor: 1.0
    cost: 1.0
    water_m3: 5.0
  restore:
    canopy_gain: 0.25
    immediacy_factor: 0.6
    cost: 2.0
    water_m3: 15.0
  plant:
    canopy_gain: 0.15
    immediacy_factor: 0.35
    cost: 3.0
    water_m3: 25.0

evaluation:
  min_preserve_candidates: 10

paths:
  processed_stack: data/processed/pilot/monthly_stack.nc
  results: results/m8
