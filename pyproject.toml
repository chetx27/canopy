[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canopy"
version = "0.1.0"
description = "Temporal geospatial AI for urban vegetation-loss detection, heat-exposure forecasting, and intervention optimization"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "CANOPY Research Team" }]
keywords = ["remote-sensing", "urban-vegetation", "geospatial", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyproj>=3.6",
    "rasterio>=1.3",
    "xarray>=2023.1",
    "shapely>=2.0",
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "tqdm>=4.66",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "folium>=0.15",
    "netCDF4>=1.6",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.384", "geemap>=0.32"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1"]
mlflow = ["mlflow>=2.9"]
all = ["canopy[gee,dev,mlflow]"]

[project.scripts]
canopy = "canopy.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
